<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>View this profile on NearMate</title>

  <meta
    name="description"
    content="Install NearMate to securely view this shared profile and discover people around you.">

  <meta name="theme-color" content="#ed2f8b">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      img-src 'self' data: https:;
      style-src 'self' 'unsafe-inline';
      script-src 'self' 'unsafe-inline';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    ">

  <style>
    :root {
      --pink: #ed2f8b;
      --pink-dark: #d71e73;
      --purple: #9a43e6;
      --purple-dark: #6f2dbd;
      --text: #24152c;
      --muted: #766b7d;
      --background: #fff9fc;
      --surface: #ffffff;
      --border: #efdce8;
      --gradient: linear-gradient(
        135deg,
        var(--pink) 0%,
        #df287f 46%,
        var(--purple) 100%
      );
      --shadow: 0 22px 60px rgba(108, 39, 95, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      padding:
        max(22px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));

      display: grid;
      place-items: center;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 5% 5%,
          rgba(237, 47, 139, 0.11),
          transparent 32%
        ),
        radial-gradient(
          circle at 95% 8%,
          rgba(154, 67, 230, 0.11),
          transparent 31%
        ),
        var(--background);
    }

    .page {
      width: min(100%, 520px);
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(239, 220, 232, 0.95);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: var(--shadow);
    }

    .top-accent {
      height: 7px;
      background: var(--gradient);
    }

    .content {
      padding: 30px 28px 28px;
      text-align: center;
    }

    .brand-logo {
      display: block;
      width: min(100%, 360px);
      height: auto;
      margin: 0 auto 24px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 36px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -0.9px;

      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .message {
      max-width: 420px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.58;
    }

    .install-grid {
      margin-top: 26px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      align-items: center;
      gap: 20px;
    }

    .play-store-link {
      min-height: 64px;
      padding: 12px 18px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      border-radius: 18px;

      color: white;
      background: #171219;

      text-decoration: none;
      text-align: left;

      box-shadow: 0 12px 24px rgba(42, 26, 40, 0.18);

      transition:
        transform 150ms ease,
        box-shadow 150ms ease;
    }

    .play-store-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 15px 28px rgba(42, 26, 40, 0.22);
    }

    .play-store-link:active {
      transform: scale(0.985);
    }

    .play-store-link:focus-visible {
      outline: 3px solid rgba(237, 47, 139, 0.30);
      outline-offset: 4px;
    }

    .play-icon {
      width: 34px;
      height: 38px;
      flex: 0 0 auto;
      display: block;
    }

    .play-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .play-small {
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.45px;
      text-transform: uppercase;
    }

    .play-large {
      font-size: 21px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.25px;
      white-space: nowrap;
    }

    .qr-wrap {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #ffffff;
    }

    .qr-code {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
    }

    .qr-note {
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .tagline {
      margin: 22px 0 0;
      color: var(--purple-dark);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 900;
      letter-spacing: 0.15px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 520px) {
      body {
        padding-left: 11px;
        padding-right: 11px;
      }

      .content {
        padding: 25px 18px 23px;
      }

      .brand-logo {
        width: min(100%, 320px);
        margin-bottom: 20px;
      }

      .install-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .play-store-link {
        width: 100%;
      }

      .qr-wrap {
        width: 155px;
        margin: 0 auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main id="profilePage" class="page">
    <section class="card">
      <div class="top-accent"></div>

      <div class="content">
        <img
          class="brand-logo"
          src="/assets/nearmate-logo.png"
          alt="NearMate">

        <h1>View this profile on NearMate</h1>

        <p class="message">
          Install NearMate to securely view this shared profile and discover
          people around you.
        </p>

        <div class="install-grid">
          <a
            id="playStoreButton"
            class="play-store-link"
            href="https://play.google.com/store/apps/details?id=com.nearmatechat.app"
            aria-label="Get NearMate on Google Play">

            <svg
              class="play-icon"
              viewBox="0 0 42 46"
              aria-hidden="true">
              <path fill="#00d7fe" d="M2 3.3C1.4 4.2 1 5.5 1 7v32c0 1.5.4 2.8 1 3.7l22.2-19.7L2 3.3z"/>
              <path fill="#ffce00" d="M31.4 16.6l-7.2 6.4 7.3 6.5 8.7-4.9c2.5-1.4 2.5-3.7 0-5.1l-8.8-4.9z"/>
              <path fill="#00f076" d="M2 3.3l27.9 15.6 1.5-1.3L7.8 4.4C5.7 3.2 3.7 2.8 2 3.3z"/>
              <path fill="#ff3a44" d="M2 42.7c1.7.5 3.7.1 5.8-1.1l23.7-13.2-1.6-1.4L2 42.7z"/>
            </svg>

            <span class="play-copy">
              <span class="play-small">Get it on</span>
              <span class="play-large">Google Play</span>
            </span>
          </a>

          <div class="qr-wrap">
            <img
              class="qr-code"
              src="/assets/nearmate_play_store_qr.svg"
              alt="QR code to install NearMate from Google Play">
          </div>
        </div>

        <p class="qr-note">
          Scan the QR code with your phone to install NearMate.
        </p>

        <p class="tagline">
          Discover People Around You
        </p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const parts = window.location.pathname
        .split("/")
        .filter(Boolean);

      const token =
        parts.length === 2 &&
        parts[0] === "p"
          ? parts[1]
          : "";

      const validProfilePath =
        token.length > 0 &&
        token.length <= 150 &&
        !/[\s/\\\u0000-\u001F]/.test(token);

      if (!validProfilePath) {
        window.location.replace("/");
        return;
      }

      document.title = "View this profile on NearMate";
    })();
  </script>
</body>
</html>
