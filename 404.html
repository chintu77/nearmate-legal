<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Open Plan in NearMate</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f7f7fb;
      color: #1c1c1e;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 28px 22px;
      text-align: center;
      background: white;
      border: 1px solid #e5e5ea;
      border-radius: 20px;
    }

    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #7b61ff;
      color: white;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #6e6e73;
      line-height: 1.5;
    }

    .plan-box {
      margin-bottom: 22px;
      padding: 18px;
      text-align: left;
      background: #f8f9fb;
      border-radius: 14px;
    }

    .plan-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: bold;
    }

    .plan-info {
      margin: 4px 0;
      color: #6e6e73;
    }

    .button {
      width: 100%;
      min-height: 50px;
      margin-top: 12px;
      padding: 14px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 25px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #7b61ff;
      color: white;
    }

    .secondary {
      background: #eeeeF4;
      color: #1c1c1e;
    }

    .error {
      display: none;
      margin-top: 16px;
      color: #d32f2f;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">N</div>

    <h1>NearMate Plan</h1>

    <p class="subtitle">
      Someone shared a plan with you on NearMate.
    </p>

    <section class="plan-box">
      <p class="plan-title" id="planTitle">Loading plan…</p>
      <p class="plan-info" id="planDate"></p>
      <p class="plan-info" id="planLocation"></p>
    </section>

    <a class="button primary" id="openAppButton" href="#">
      Open in NearMate
    </a>

    <a
      class="button secondary"
      href="https://play.google.com/store/apps/details?id=com.nearmatechat.app">
      Install NearMate
    </a>

    <p class="error" id="errorMessage">
      This plan is unavailable.
    </p>
  </main>

  <script>
    const pathParts = window.location.pathname
      .split("/")
      .filter(Boolean);

    const isPlanPath =
      pathParts.length === 2 &&
      pathParts[0] === "plan" &&
      pathParts[1].trim() !== "";

    if (!isPlanPath) {
      document.getElementById("planTitle").textContent =
        "Page not found";

      document.getElementById("errorMessage").style.display =
        "block";

      document.getElementById("openAppButton").style.display =
        "none";
    } else {
      const planId = encodeURIComponent(pathParts[1]);

      document.getElementById("openAppButton").href =
        `https://nearmatechat.com/plan/${planId}`;

      // Actual public Plan details will be loaded in the next step.
      document.getElementById("planTitle").textContent =
        "Plan shared through NearMate";
    }
  </script>
</body>
</html>
