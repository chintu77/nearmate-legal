<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>View this profile on NearMate</title>
<meta name="theme-color" content="#ed2f8b">
<style>
:root{
--pink:#ed2f8b;--purple:#9a43e6;--bg:#fff9fc;--text:#28192e;--muted:#726978;
--grad:linear-gradient(135deg,var(--pink),var(--purple));
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
background:
radial-gradient(circle at top left,rgba(237,47,139,.12),transparent 35%),
radial-gradient(circle at top right,rgba(154,67,230,.12),transparent 35%),
var(--bg);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:18px;
color:var(--text);
}
.card{
width:100%;
max-width:520px;
background:#fff;
border-radius:28px;
overflow:hidden;
box-shadow:0 20px 55px rgba(88,34,76,.15);
}
.top{height:7px;background:var(--grad);}
.content{padding:34px 26px;text-align:center}
.logo{width:min(100%,340px);display:block;margin:0 auto 24px}
h1{
margin:0;
font-size:34px;
font-weight:900;
line-height:1.15;
background:var(--grad);
-webkit-background-clip:text;
color:transparent;
}
p{
margin:16px auto 0;
max-width:380px;
font-size:16px;
line-height:1.6;
color:var(--muted);
}
.play{
margin:30px auto 0;
display:inline-flex;
align-items:center;
gap:14px;
padding:15px 26px;
border-radius:18px;
background:#111;
color:#fff;
text-decoration:none;
font-weight:800;
font-size:20px;
box-shadow:0 12px 28px rgba(0,0,0,.2);
transition:.18s;
}
.play:hover{transform:translateY(-2px)}
.small{display:block;font-size:10px;letter-spacing:.4px;text-transform:uppercase;font-weight:700}
.tag{
margin-top:28px;
font-size:15px;
font-weight:900;
color:#7b2ac7;
}
@media(max-width:520px){
h1{font-size:28px}
.play{width:100%;justify-content:center}
.logo{width:280px}
}
</style>
</head>
<body>
<div class="card">
<div class="top"></div>
<div class="content">
<img class="logo" src="/assets/nearmate-logo.png" alt="NearMate">
<h1>View this profile on NearMate</h1>
<p>Install NearMate to securely view this shared profile, connect with people nearby, and start meaningful conversations.</p>

<a
    href="https://play.google.com/store/apps/details?id=com.nearmatechat.app"
    target="_blank"
    rel="noopener noreferrer"
    class="play-store-button">

    <img
        src="/assets/google-play-badge.png"
        alt="Get it on Google Play"
        class="play-store-badge">
</a>

<div class="tag">Discover People Around You</div>
</div>
</div>

<script>
(()=>{
const p=location.pathname.split('/').filter(Boolean);
const ok=p.length===2&&p[0]==='p'&&p[1].length>0&&p[1].length<=150&&!/[\s/\\\u0000-\u001F]/.test(p[1]);
if(!ok){
location.replace('/');
}
})();
</script>
</body>
</html>
