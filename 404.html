<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>View this profile on NearMate</title>

  <meta
    name="description"
    content="Open this shared profile securely in the NearMate app.">

  <meta name="theme-color" content="#ed2f8b">

  <style>
    :root {
      --pink: #ed2f8b;
      --pink-dark: #d71e73;
      --purple: #9a43e6;
      --purple-dark: #762fc0;

      --text: #3d2443;
      --muted: #766a7a;
      --background: #fff9fc;
      --surface: #ffffff;
      --border: #efdce8;

      --gradient: linear-gradient(
        135deg,
        var(--pink) 0%,
        #df287f 48%,
        var(--purple) 100%
      );

      --shadow:
        0 22px 60px rgba(104, 39, 91, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;

      padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 5% 4%,
          rgba(237, 47, 139, 0.13),
          transparent 34%
        ),
        radial-gradient(
          circle at 96% 8%,
          rgba(154, 67, 230, 0.13),
          transparent 34%
        ),
        var(--background);
    }

    .page {
      width: 100%;
      max-width: 520px;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(239, 220, 232, 0.96);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: var(--shadow);
    }

    .top-accent {
      height: 7px;
      background: var(--gradient);
    }

    .content {
      padding: 31px 26px 29px;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(100%, 330px);
      height: auto;
      margin: 0 auto 24px;
      object-fit: contain;
    }

    .title {
      margin: 0;

      font-size: clamp(28px, 6vw, 36px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -0.8px;

      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .description {
      max-width: 410px;
      margin: 15px auto 0;

      color: var(--muted);
      font-size: 16px;
      line-height: 1.58;
    }

    .actions {
      width: 100%;
      max-width: 350px;
      margin: 28px auto 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .view-profile-button {
      width: 100%;
      min-height: 56px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;

      padding: 14px 22px;

      border: 0;
      border-radius: 17px;

      color: #ffffff;
      background: var(--gradient);

      font-family: inherit;
      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 13px 30px rgba(180, 50, 163, 0.28);

      transition:
        transform 160ms ease,
        box-shadow 160ms ease,
        opacity 160ms ease;
    }

    .view-profile-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 17px 36px rgba(180, 50, 163, 0.34);
    }

    .view-profile-button:active {
      transform: scale(0.985);
    }

    .view-profile-button:focus-visible {
      outline: 3px solid rgba(237, 47, 139, 0.28);
      outline-offset: 4px;
    }

    .view-profile-button:disabled {
      cursor: default;
      opacity: 0.72;
    }

    .button-icon {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }

    .install-label {
      margin: 1px 0 -5px;

      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .play-store-button {
      display: inline-block;

      margin: 0 auto;
      padding: 0;

      border: 0;
      background: transparent;
      text-decoration: none;

      line-height: 0;

      transition:
        transform 160ms ease,
        opacity 160ms ease;
    }

    .play-store-button:hover {
      transform: translateY(-2px);
    }

    .play-store-button:active {
      transform: scale(0.98);
    }

    .play-store-button:focus-visible {
      outline: 3px solid rgba(237, 47, 139, 0.28);
      outline-offset: 6px;
      border-radius: 8px;
    }

    .play-store-badge {
      display: block;

      width: 220px;
      max-width: 100%;
      height: auto;

      margin: 0;
      padding: 0;

      border: 0;
      border-radius: 0;

      background: transparent;
      box-shadow: none;
    }

    .status {
      display: none;

      min-height: 20px;
      margin: 15px auto 0;

      color: var(--purple-dark);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 700;
    }

    .status.visible {
      display: block;
    }

    .tagline {
      margin: 22px 0 0;

      color: var(--purple-dark);
      font-size: 15px;
      line-height: 1.4;
      font-weight: 900;
      letter-spacing: 0.15px;
    }

    .privacy-note {
      max-width: 390px;
      margin: 10px auto 0;

      color: #968b9a;
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 520px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .content {
        padding: 26px 18px 24px;
      }

      .logo {
        width: min(100%, 285px);
        margin-bottom: 21px;
      }

      .title {
        font-size: 28px;
      }

      .description {
        font-size: 15px;
      }

      .actions {
        margin-top: 25px;
      }

      .play-store-badge {
        width: 210px;
      }
    }

    @media (max-width: 360px) {
      .content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .title {
        font-size: 25px;
      }

      .view-profile-button {
        min-height: 52px;
        padding-left: 16px;
        padding-right: 16px;
        font-size: 15px;
      }

      .play-store-badge {
        width: 195px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="top-accent"></div>

      <div class="content">

        <img
          class="logo"
          src="/assets/nearmate-logo.png"
          alt="NearMate">

        <h1 class="title">
          View this profile on NearMate
        </h1>

        <p class="description">
          Open this shared profile securely in NearMate and discover
          people around you.
        </p>

        <div class="actions">

          <button
            id="viewProfileButton"
            class="view-profile-button"
            type="button">

            <svg
              class="button-icon"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true">

              <path
                d="M8 5l7 7-7 7"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round">
              </path>
            </svg>

            <span>View Profile</span>
          </button>

          <p class="install-label">
            Don’t have NearMate yet?
          </p>

          <a
            id="installButton"
            class="play-store-button"
            href="https://play.google.com/store/apps/details?id=com.nearmatechat.app"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Get NearMate on Google Play">

            <img
              class="play-store-badge"
              src="/assets/google-play-badge.svg"
              alt="Get it on Google Play">
          </a>

        </div>

        <p
          id="openStatus"
          class="status"
          aria-live="polite">

          Opening NearMate…
        </p>

        <p class="tagline">
          Discover People Around You
        </p>

        <p class="privacy-note">
          The shared profile can be viewed securely inside the NearMate app.
        </p>

      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const PACKAGE_NAME = "com.nearmatechat.app";

      const PLAY_STORE_URL =
        "https://play.google.com/store/apps/details?id=" +
        encodeURIComponent(PACKAGE_NAME);

      const pathParts = window.location.pathname
        .split("/")
        .filter(Boolean);

      const isValidProfilePath =
        pathParts.length === 2 &&
        pathParts[0].toLowerCase() === "p" &&
        pathParts[1].length > 0 &&
        pathParts[1].length <= 150 &&
        !/[\s/\\\u0000-\u001F]/.test(pathParts[1]);

      if (!isValidProfilePath) {
        window.location.replace("/");
        return;
      }

      const profileToken = pathParts[1];

      const profileHttpsUrl =
        "https://nearmatechat.com/p/" +
        encodeURIComponent(profileToken);

      const androidIntentUrl =
        "intent://nearmatechat.com/p/" +
        encodeURIComponent(profileToken) +
        "#Intent;" +
        "scheme=https;" +
        "package=" +
        PACKAGE_NAME +
        ";" +
        "S.browser_fallback_url=" +
        encodeURIComponent(PLAY_STORE_URL) +
        ";end";

      const viewProfileButton =
        document.getElementById("viewProfileButton");

      const installButton =
        document.getElementById("installButton");

      const openStatus =
        document.getElementById("openStatus");

      installButton.href = PLAY_STORE_URL;

      function isAndroidDevice() {
        return /Android/i.test(navigator.userAgent);
      }

      function showOpeningStatus() {
        openStatus.textContent = "Opening NearMate…";
        openStatus.classList.add("visible");

        viewProfileButton.disabled = true;
      }

      function resetOpeningState() {
        viewProfileButton.disabled = false;
        openStatus.classList.remove("visible");
      }

      function openProfile() {
        showOpeningStatus();

        if (isAndroidDevice()) {
          /*
           * NearMate installed:
           * Android opens the app and sends the profile URL/token.
           *
           * NearMate not installed:
           * The browser fallback opens Google Play.
           */
          window.location.href = androidIntentUrl;
        } else {
          /*
           * NearMate currently supports Android only.
           */
          window.location.href = PLAY_STORE_URL;
        }

        window.setTimeout(resetOpeningState, 3000);
      }

      viewProfileButton.addEventListener(
        "click",
        openProfile
      );

      document.addEventListener(
        "visibilitychange",
        () => {
          if (document.hidden) {
            openStatus.textContent =
              "NearMate opened successfully.";
          }
        }
      );

      document.title =
        "View this profile on NearMate";

      window.NearMateShare = {
        token: profileToken,
        profileUrl: profileHttpsUrl
      };
    })();
  </script>
</body>
</html>
